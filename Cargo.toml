[workspace]
resolver = "2"
members = ["crates/browser-core", "crates/browser-ui", "crates/privacy-engine", "crates/security-manager", "crates/resource-manager"]
exclude = ["crates/servo-integration"]

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
url = "2.5"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
