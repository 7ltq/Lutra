[package]
name = "servo-integration"
version = "0.10.0"
edition = "2021"
license = "MIT"

[features]
default = []
servo-experimental = ["dep:servo", "dep:euclid", "dep:winit", "dep:rustls", "dep:egui", "dep:egui_glow", "dep:image"]

[dependencies]
browser-core = { path = "../browser-core" }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
egui = { version = "=0.34.3", optional = true }
egui_glow = { version = "=0.34.3", features = ["winit"], optional = true }
url = "2.5"
servo = { version = "=0.7.0", optional = true }
euclid = { version = "0.22", optional = true }
winit = { version = "0.30.13", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"], optional = true }

[target.'cfg(windows)'.dependencies]
servo = { version = "=0.7.0", features = ["no-wgl"], optional = true }

[[bin]]
name = "servo-preview"
path = "src/bin/servo_preview.rs"
required-features = ["servo-experimental"]

[workspace]
